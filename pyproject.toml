[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gcae"
version = "0.1.6"
description = "Git-Checkpointed Adaptive Execution runtime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.0", "httpx>=0.27", "textual>=1.0"]
keywords = ["agents", "git", "llm", "code-generation", "checkpointing", "tui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "build>=1.2"]

[project.urls]
Homepage = "https://github.com/mberkanbicer/gcae"
Documentation = "https://github.com/mberkanbicer/gcae/tree/main/docs"
Changelog = "https://github.com/mberkanbicer/gcae/blob/main/CHANGELOG.md"

[project.scripts]
gcae = "gcae.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gcae"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
exclude = "tests"
