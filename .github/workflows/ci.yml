name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: ruff
        run: ruff check .
      - name: mypy (strict)
        run: mypy src/gcae

  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Configure git for the suites that create repositories
        run: |
          git config --global user.name "GCAE CI"
          git config --global user.email "ci@gcae.invalid"
          git config --global init.defaultBranch main
      - name: pytest
        run: pytest -q

  build:
    name: build (sdist + wheel)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build tooling
        run: python -m pip install build
      - name: Build sdist and wheel
        run: python -m build
      - name: The wheel must install and expose the CLI
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/python -m pip install dist/*.whl
          /tmp/wheel-check/bin/gcae --version
      - uses: actions/upload-artifact@v7
        with:
          name: gcae-dist
          path: dist/*
          if-no-files-found: error

  release:
    name: release ${{ github.ref_name }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: gcae-dist
          path: dist
      - name: Publish the GitHub release with the build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "GCAE $GITHUB_REF_NAME" \
            --notes-file CHANGELOG.md

  publish:
    name: publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # trusted publishing: no PyPI token in the repository
    environment: pypi
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: gcae-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
