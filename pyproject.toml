[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gcae"
version = "0.1.0"
description = "Git-Checkpointed Adaptive Execution runtime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.0", "httpx>=0.27", "textual>=1.0"]

[project.scripts]
gcae = "gcae.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gcae"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
exclude = "tests"
