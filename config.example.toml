[runtime]
state_dir = "~/.local/state/gcae"
worktree_dir = "~/.local/state/gcae/worktrees"
max_steps = 20
command_timeout = 30

[provider]
kind = "fake"
base_url = "http://localhost:11434/v1"
model = "llama3.2"
api_key_env = "OPENAI_API_KEY"
timeout = 60
# Token budget for reconstructed context and the provider's maximum output tokens.
context_limit = 8192

[provider.generation]
temperature = 0.0
max_tokens = 1024

[evaluator]
# "deterministic" uses validation rules; "llm" asks the configured model.
kind = "deterministic"

[validation]
commands = []
