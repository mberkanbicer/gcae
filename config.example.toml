[runtime]
state_dir = "~/.local/state/gcae"
worktree_dir = "~/.local/state/gcae/worktrees"
# Create the base commit a run needs (unborn HEAD, dirty tree) instead of refusing.
# Never touches file contents; bounded to 2000 files / 50 MB and reported.
auto_bootstrap = true
# Merge the verified branch into the current branch when a run completes, so the work
# is visible in your checkout. Recorded in state.json; `gcae undo` reverses it.
auto_merge = true
# Also hand over the checkpoints a failed or stopped run accepted (marked unverified).
merge_accepted_on_failure = true
# A conflicting merge is resolved by the agent inside the run worktree, then re-verified
# and retried. Conflict markers are never committed or merged.
resolve_merge_conflicts = true
# Remove GCAE's worktree once its branch is merged. The branch is kept, so `gcae undo`
# still reverses the merge and the work can be merged again.
cleanup_after_merge = true
max_steps = 20
# Self-recovery: a run that is about to fail reads its own trace and tries a correction
# before it asks the user. recovery_attempts bounds the self-diagnoses per run;
# recovery_budget is how many extra iterations each successful correction buys.
recovery_attempts = 2
recovery_budget = 5
command_timeout = 30
max_tool_calls_per_step = 8
stagnation_window = 3
repetition_limit = 2
scope_warning_files = 10

[provider]
kind = "fake"
base_url = "http://localhost:11434/v1"
model = "llama3.2"
api_key_env = "OPENAI_API_KEY"
timeout = 60
# Stream completions: the dashboard shows tokens arriving and a hung endpoint is detected as
# a stall instead of looking like a frozen run. Falls back to a buffered request automatically.
stream = true
stall_timeout = 45.0
# Token budget for reconstructed context and the provider's maximum output tokens.
context_limit = 8192
# response_format=json_object. Reasoning models (e.g. many :free OpenRouter models) can
# deliberate until the output budget is gone and never emit content; set false for them.
json_mode = true

[provider.generation]
temperature = 0.0
max_tokens = 1024

# Optional per-role model overrides; unset fields inherit from [provider].
# [models.planner]
# model = "qwen3:32b"
# [models.evaluator]
# model = "qwen3:32b"
# [models.escalation]
# model = "anthropic/claude-sonnet-4"
# Diagnoses a failing run from its own trace (defaults to the controller's model).
# [models.recovery]
# model = "anthropic/claude-sonnet-4"

[planner]
# auto: model-backed for http/openrouter providers, deterministic otherwise.
kind = "auto"

[evaluator]
# "deterministic" uses validation rules; "llm" asks the configured model.
kind = "deterministic"

[verifier]
# "deterministic" fails non-checkable criteria; "hybrid" lets the configured
# verifier model judge them from evidence (still fail-closed).
kind = "deterministic"

[validation]
commands = []
