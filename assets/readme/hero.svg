<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">GCAE — Git-Checkpointed Adaptive Execution</title>
  <desc id="hero-desc">GCAE title card with a real terminal transcript of a finished run: the run
  completed, both criteria passed, two documents were produced, and the verified branch was merged
  into the working tree. A checkpoint rail marks accepted checkpoints and the rolled back
  candidate.</desc>

  <defs>
    <clipPath id="hero-clip">
      <rect width="1200" height="400" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#hero-clip)">
    <rect width="1200" height="400" fill="#0B0E11"/>

    <line x1="56" y1="336" x2="1144" y2="336" stroke="#1C2228" stroke-width="1"/>

    <!-- identity -->
    <text x="56" y="66" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="17" font-weight="600" letter-spacing="3" fill="#8B949E">GIT-CHECKPOINTED ADAPTIVE EXECUTION</text>
    <text x="56" y="140" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="72" font-weight="700" fill="#E6EDF3" letter-spacing="2">GCAE</text>
    <text x="56" y="190" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="23" fill="#C9D1D9">A single-agent coding runtime that keeps</text>
    <text x="56" y="222" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="23" fill="#C9D1D9">only what it can verify.</text>

    <g fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
      <rect x="56" y="252" width="11" height="11" rx="2" fill="#3FB950"/>
      <text x="78" y="262">isolated git worktree per run</text>
      <rect x="56" y="282" width="11" height="11" rx="2" fill="#3FB950"/>
      <text x="78" y="292">rollback that keeps what it learned</text>
      <rect x="56" y="312" width="11" height="11" rx="2" fill="#3FB950"/>
      <text x="78" y="322">reversible merge into your branch</text>
    </g>

    <!-- real transcript: the proof -->
    <g transform="translate(668 44)">
      <rect x="0" y="0" width="476" height="276" rx="12" fill="#12171C" stroke="#232B33" stroke-width="1"/>
      <line x1="0" y1="40" x2="476" y2="40" stroke="#232B33" stroke-width="1"/>
      <circle cx="22" cy="20" r="4" fill="#2A3139"/>
      <circle cx="36" cy="20" r="4" fill="#2A3139"/>
      <circle cx="50" cy="20" r="4" fill="#2A3139"/>
      <text x="70" y="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="16" fill="#8B949E">gcae run ~/project --headless</text>

      <!-- checkpoint rail: accepted, rolled back, accepted -->
      <line x1="28" y1="74" x2="28" y2="230" stroke="#2A3139" stroke-width="2"/>
      <circle cx="28" cy="74" r="6" fill="#3FB950"/>
      <circle cx="28" cy="170" r="6" fill="#12171C" stroke="#D29922" stroke-width="2"/>
      <circle cx="28" cy="230" r="6" fill="#3FB950"/>

      <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">
        <text x="50" y="80" fill="#E6EDF3">run 7c21a9: complete</text>
        <text x="50" y="110" fill="#8B949E">accepted steps: 3</text>
        <text x="50" y="140" fill="#8B949E">verification: 2/2 criteria passed</text>
        <text x="50" y="176" fill="#E6EDF3">files: importer.py, test_importer.py</text>
        <text x="50" y="206" fill="#8B949E">documents: ~/project</text>
        <text x="50" y="236" fill="#3FB950">merged into main · 1f0c2a4</text>
      </g>
      <text x="28" y="270" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="16" fill="#6E7681">amber: rejected candidate, rolled back before merge</text>
    </g>

    <!-- metadata -->
    <text x="56" y="368" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="16" fill="#6E7681">python 3.12+ · pydantic · httpx · textual · MIT</text>
    <text x="1144" y="368" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="16" fill="#6E7681" text-anchor="end">the model never runs git; the loop does</text>
  </g>
</svg>
