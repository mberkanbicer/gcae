[runtime]
state_dir = "~/.local/state/gcae"
worktree_dir = "~/.local/state/gcae/worktrees"
max_steps = 20
command_timeout = 30
max_tool_calls_per_step = 8
stagnation_window = 3
repetition_limit = 2
scope_warning_files = 10

[provider]
kind = "fake"
base_url = "http://localhost:11434/v1"
model = "llama3.2"
api_key_env = "OPENAI_API_KEY"
timeout = 60
# Token budget for reconstructed context and the provider's maximum output tokens.
context_limit = 8192

[provider.generation]
temperature = 0.0
max_tokens = 1024

# Optional per-role model overrides; unset fields inherit from [provider].
# [models.planner]
# model = "qwen3:32b"
# [models.evaluator]
# model = "qwen3:32b"
# [models.escalation]
# model = "anthropic/claude-sonnet-4"

[planner]
# auto: model-backed for http/openrouter providers, deterministic otherwise.
kind = "auto"

[evaluator]
# "deterministic" uses validation rules; "llm" asks the configured model.
kind = "deterministic"

[validation]
commands = []
